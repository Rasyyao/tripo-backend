services:
  postgres:
    image: postgres:16-alpine
    container_name: tripo-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tripo-pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # Generate the pre-registered server (from .env values) before starting pgAdmin
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "postgres:5432:$${POSTGRES_DB}:$${POSTGRES_USER}:$${POSTGRES_PASSWORD}" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        cat > /tmp/servers.json <<JSON
        {"Servers":{"1":{"Name":"tripo","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"$${POSTGRES_DB}","Username":"$${POSTGRES_USER}","PassFile":"/tmp/pgpass","SSLMode":"prefer"}}}
        JSON
        exec /entrypoint.sh

volumes:
  postgres_data:
  pgadmin_data:
