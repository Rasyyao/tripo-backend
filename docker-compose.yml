services:
  postgres:
    image: postgres:16-alpine
    container_name: tripo-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: tripo-api
    restart: unless-stopped
    environment:
      APP_PORT: "3000"
      DB_HOST: postgres
      POSTGRES_PORT: "5432" # container-internal port, not the host-mapped one
      POSTGRES_USER: ${POSTGRES_USER:-tripo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripo_password}
      POSTGRES_DB: ${POSTGRES_DB:-tripo}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (32+ characters)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tripo-pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # Generate the pre-registered server (from .env values) before starting pgAdmin
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "postgres:5432:$${POSTGRES_DB}:$${POSTGRES_USER}:$${POSTGRES_PASSWORD}" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        cat > /tmp/servers.json <<JSON
        {"Servers":{"1":{"Name":"tripo","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"$${POSTGRES_DB}","Username":"$${POSTGRES_USER}","PassFile":"/tmp/pgpass","SSLMode":"prefer"}}}
        JSON
        exec /entrypoint.sh

volumes:
  postgres_data:
  pgadmin_data:
